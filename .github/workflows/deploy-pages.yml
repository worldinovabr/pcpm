name: Deploy to GitHub Pages

# Publica dist/ na branch "gh-pages" (método clássico do GitHub Pages),
# em vez do método "Source: GitHub Actions". Mesmo assim, a primeira
# ativação do GitHub Pages exige 1 clique manual nas configurações do
# repositório (Settings > Pages > Source > Deploy from a branch > gh-pages),
# pois o GitHub não permite habilitar o Pages de um repositório pela
# primeira vez usando o token automático do workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publicar dist/ na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: gh-pages
